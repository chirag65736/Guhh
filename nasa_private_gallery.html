
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cɪᴘʜᴇʀ · No Access — @nasa</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #05060a;
            color: #e6f1ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(255, 56, 96, 0.10), transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(255, 43, 214, 0.08), transparent 45%);
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255, 56, 96, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 56, 96, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .container {
            position: relative;
            max-width: 620px;
            width: 100%;
            background: rgba(10, 13, 20, 0.85);
            border: 1px solid rgba(255, 56, 96, 0.25);
            border-radius: 20px;
            padding: 50px 40px;
            backdrop-filter: blur(14px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #00e5ff, #ff2bd6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .brand-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: #7a8aa3;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        .target {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            color: #00e5ff;
            margin-bottom: 4px;
        }
        .made {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #ff2bd6;
            letter-spacing: 1px;
            margin-top: 8px;
            margin-bottom: 30px;
        }
        .fail {
            background: rgba(255, 56, 96, 0.08);
            border: 1px solid rgba(255, 56, 96, 0.45);
            color: #ff3860;
            padding: 26px 20px;
            border-radius: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 2px;
            box-shadow: 0 0 40px rgba(255, 56, 96, 0.15) inset;
        }
        .fail .sub {
            display: block;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: rgba(255, 56, 96, 0.75);
            margin-top: 12px;
        }
        .footer {
            margin-top: 34px;
            padding-top: 22px;
            border-top: 1px solid rgba(0, 229, 255, 0.1);
            color: #7a8aa3;
            font-size: 0.78rem;
        }
        .footer .mini {
            font-family: 'JetBrains Mono', monospace;
            color: #00e5ff;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">Cɪᴘʜᴇʀ</div>
        <div class="brand-sub">Private Access Engine</div>
        <div class="target">TARGET → @nasa</div>
        <div class="made">◈ Made by Ryon · CipherXPortal ◈</div>

        <div class="fail">
            ✕ UNSUCCESSFUL
            <span class="sub">No private posts found · account may be public or unreachable</span>
        </div>

        <div class="footer">
            <div class="mini">Cɪᴘʜᴇʀ</div>
            <div>Instagram Private Post Monitor — POC</div>
        </div>
    </div>
</body>
</html>
