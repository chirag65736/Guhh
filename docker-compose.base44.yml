services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
      - cipher_data:/app/data
    ports:
      - "3000:8080"
    command: ["sh", "-ec", "apt-get update && apt-get install -y --no-install-recommends tor && pip install --no-cache-dir -r requirements.txt && tor --RunAsDaemon 1 && sleep 8 && exec python web_server.py"]
    environment:
      - INSTAGRAM_PROXY=socks5://127.0.0.1:9050
    env_file:
      - /run/base44/app.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  cipher_data:
